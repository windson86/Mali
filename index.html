<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MALI – probna soba</title>
<style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#353037;background:#f6f7f2}*{box-sizing:border-box}
body{margin:0}button{font:inherit}#game{position:relative;height:100dvh;min-height:610px;overflow:hidden;background:linear-gradient(#e8f4ed 0 67%,#a7d9aa 67% 100%);isolation:isolate}
#game:before{content:"";position:absolute;top:67%;width:100%;border-top:4px solid #4b5247;z-index:0}
#game:after{content:"";position:absolute;inset:67% 0 0;opacity:.2;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 65px,#63906c 66px 67px)}
.top{position:absolute;top:14px;left:14px;right:14px;z-index:20;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.brand{background:#fffdf3;border:3px solid #353037;border-radius:17px;padding:8px 15px;box-shadow:3px 4px 0 #353037;font-weight:1000;letter-spacing:.1em}.brand small{display:block;font-size:9px;letter-spacing:0;color:#817978}.stat{min-width:91px;background:#fffdf3;border:2px solid #353037;border-radius:12px;padding:7px 9px;flex:0 1 116px}.stat .small{display:flex;justify-content:space-between;font-size:11px;font-weight:900;gap:5px}.bar{margin-top:5px;height:7px;border-radius:20px;background:#e5e0dc;overflow:hidden}.fill{height:100%;transition:width .25s;width:65%;background:#d9ad6c}.stat:nth-of-type(3) .fill{background:#81bed9}.stat:nth-of-type(4) .fill{background:#e89ca2}.day{margin-left:auto;border:2px solid #353037;border-radius:30px;padding:9px 12px;background:#ffe6a8;font-size:11px;font-weight:900}
.wall-decoration{position:absolute;top:20%;left:9%;height:90px;width:110px;border:4px solid #353037;border-radius:13px;background:#bde3f5;overflow:hidden;box-shadow:6px 6px 0 #c8ddd0}.wall-decoration:before{content:"";position:absolute;bottom:-26px;left:-9px;width:140px;height:66px;background:#96c8a0;border-radius:50%}.wall-decoration:after{content:"";position:absolute;left:50%;height:100%;border-left:4px solid #353037}
.zone{position:absolute;z-index:4;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;transition:filter .17s,transform .17s}.zone:hover{filter:brightness(1.055);transform:translateY(-2px)}.zone:focus-visible,.modal button:focus-visible{outline:4px solid #3366e0;outline-offset:4px;border-radius:13px}.zone svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(1px 4px 0 #00000013)}
.zone-label{position:absolute;bottom:-8px;white-space:nowrap;padding:4px 9px;background:#fffefa;border:2px solid #353037;border-radius:13px;font-size:11px;font-weight:900;box-shadow:2px 2px 0 #353037;pointer-events:none}
#house{right:8%;top:19%;width:clamp(145px,21vw,248px);aspect-ratio:1.12}#bowl{right:27%;top:58%;width:clamp(65px,9vw,100px);height:65px}#ball{right:10%;top:57%;width:clamp(62px,8vw,96px);aspect-ratio:1}#walking{right:5%;bottom:5%;width:clamp(95px,12vw,148px);height:93px}#training{left:5%;bottom:5%;width:clamp(114px,15vw,175px);height:102px}
#dog{position:absolute;z-index:5;width:clamp(145px,20vw,230px);aspect-ratio:1;left:47%;top:64%;transform:translate(-50%,-50%);transition:left .68s ease,top .68s ease;cursor:pointer;filter:drop-shadow(0 7px 0 #3d463419);touch-action:manipulation}#dog svg{width:100%;height:100%;overflow:visible}
/* Click/touch only painted puppy, not the large transparent SVG rectangle. */
#dog,#dog svg{pointer-events:none}
#dog svg path,#dog svg ellipse,#dog svg circle{pointer-events:visiblePainted;cursor:pointer}
#dog:focus-visible{outline:3px solid #578cd1;outline-offset:5px;border-radius:25%}#tail{transform-origin:180px 139px;animation:wag .58s ease-in-out infinite alternate}#dog[data-mood="sleep"] #tail{animation:none}#dog[data-mood="excited"] #tail{animation-duration:.16s}#dog[data-mood="sleep"] .eye-open{display:none}#dog .eye-sleep{display:none}#dog[data-mood="sleep"] .eye-sleep{display:block}#dog[data-mood="sad"] .mouth{transform:rotate(180deg);transform-origin:120px 119px}
@keyframes wag{to{transform:rotate(22deg)}}@keyframes hop{50%{translate:0 -13px}}#dog[data-mood="excited"] svg{animation:hop .3s ease-in-out 2}
.bubble{position:absolute;z-index:10;left:47%;top:calc(64% - 135px);transform:translate(-50%,-10px);background:#fffefa;border:3px solid #353037;border-radius:20px;padding:10px 13px;font-size:14px;white-space:nowrap;max-width:65vw;text-overflow:ellipsis;overflow:hidden;font-weight:900;box-shadow:3px 3px 0 #353037;transition:left .68s ease,top .68s ease;pointer-events:none}
.info{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:8;background:#fffdf3;border:2px solid #353037;border-radius:18px;padding:9px 14px;max-width:43%;font-size:12px;font-weight:700;text-align:center;box-shadow:2px 3px 0 #353037}.hint{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);z-index:6;color:#4f6355;font-weight:800;font-size:10px;white-space:nowrap}
.overlay{position:absolute;z-index:30;inset:0;background:#282a2a8b;display:grid;place-items:center;padding:14px}.overlay[hidden]{display:none}.modal{width:min(92vw,410px);background:#fffdf3;border:4px solid #353037;border-radius:22px;padding:23px;box-shadow:7px 8px 0 #27282b;position:relative;text-align:center}.modal h2{margin:0 20px 9px;font-size:23px}.modal p{font-size:14px;line-height:1.45;margin:0 0 17px}.close{position:absolute;top:9px;right:9px;background:#f5d5d5;border:2px solid #353037;border-radius:12px;padding:5px 9px;cursor:pointer;font-weight:900}.action{border:2px solid #353037;background:#d5eecf;border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:900;box-shadow:2px 3px 0 #353037}.action:active{transform:translate(2px,3px);box-shadow:none}.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.ball-choice{width:50px;height:50px;border:3px solid #353037;border-radius:50%;cursor:pointer;box-shadow:2px 3px 0 #353037}.ball-choice[aria-pressed="true"]{outline:3px solid #6f94e1;outline-offset:3px}.arrows{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,49px);justify-content:center;gap:7px;margin:15px 0}.arrows .action{padding:5px}.progress{height:15px;background:#e1ddd1;border:2px solid #353037;border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#90c8a3;width:0;transition:width .2s}.muted{color:#79737a;font-size:12px!important}.school-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0}.school-grid .action{min-height:45px}.school-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.school-status{padding:9px;background:#eaf0db;border-radius:12px;font-weight:800}.school-export{font-size:12px}.school-preview{margin:12px auto}.modal{max-height:calc(100dvh - 30px);overflow-y:auto;scrollbar-gutter:stable}.school-grid .action:disabled{opacity:.5;cursor:default}.ball-preview{width:76px;height:76px;margin:10px auto;border:4px solid #353037;border-radius:50%;background:#e76e70;box-shadow:inset -11px -7px 0 #00000010}
@media(max-width:640px){.top{gap:5px;top:8px;left:8px;right:8px}.brand{padding:7px 9px;font-size:17px}.brand small{font-size:8px}.stat{padding:5px 6px;min-width:69px;flex:1 1 69px}.stat .small{font-size:9px}.day{padding:6px 9px;font-size:9px}.wall-decoration{top:24%;left:6%;width:75px;height:68px}#house{right:4%;top:24%;width:154px}#bowl{right:32%;top:56%;width:74px;height:59px}#ball{right:7%;top:58%;width:69px}#dog{width:165px;left:40%;top:66%}.bubble{left:40%;top:calc(66% - 100px);font-size:11px;padding:7px 9px}#walking{right:3%;bottom:8%;width:97px;height:80px}#training{left:3%;bottom:8%;width:100px;height:88px}.info{bottom:4px;left:50%;min-width:145px;max-width:42%;font-size:10px;padding:6px 8px}.zone-label{font-size:10px}#game{min-height:620px}}
@media(max-width:360px){.day{display:none}#house{width:132px;right:2%}#dog{left:38%;width:150px}#bowl{right:33%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="./maze.css">
</head><body>
<main id="game" aria-label="Malijeva interaktivna soba">
<header class="top"><div class="brand">MALI 🐾<small>MOJ MALI SVIJET</small></div><div class="stat"><div class="small">🍗 Sitost <span id="foodN">75</span></div><div class="bar"><div id="foodB" class="fill"></div></div></div><div class="stat"><div class="small">⚡ Energija <span id="energyN">80</span></div><div class="bar"><div id="energyB" class="fill"></div></div></div><div class="stat"><div class="small">❤️ Sreća <span id="joyN">80</span></div><div class="bar"><div id="joyB" class="fill"></div></div></div><div class="day" id="day">DAN 1</div></header>
<div class="wall-decoration" aria-hidden="true"></div>
<button class="zone" id="house" aria-label="Kućica - spavanje" title="Kućica / spavanje"><svg viewBox="0 0 220 200" aria-hidden="true"><path d="M12 91L111 12L210 91L198 106H22Z" fill="#d9946f" stroke="#353037" stroke-width="7" stroke-linejoin="round"/><rect x="33" y="91" width="157" height="98" rx="11" fill="#f3c78e" stroke="#353037" stroke-width="7"/><path d="M80 188V135Q80 105 111 105Q141 105 141 135V188" fill="#625452" stroke="#353037" stroke-width="7"/><rect x="68" y="55" width="88" height="26" rx="10" fill="#fff5ce" stroke="#353037" stroke-width="5"/><text x="112" y="73" text-anchor="middle" font-size="17" font-weight="1000" fill="#353037">MALI</text></svg><span class="zone-label">Kućica 💤</span></button>
<button class="zone" id="bowl" aria-label="Posuda za hranu" title="Nahrani Malog"><svg viewBox="0 0 110 85" aria-hidden="true"><ellipse cx="55" cy="24" rx="46" ry="15" fill="#caa783" stroke="#353037" stroke-width="5"/><path d="M8 27L20 67Q56 87 90 67L102 27" fill="#80b6ce" stroke="#353037" stroke-width="5" stroke-linejoin="round"/><ellipse cx="55" cy="27" rx="45" ry="13" fill="#d4a47e" stroke="#353037" stroke-width="4"/><circle cx="42" cy="24" r="7" fill="#8b6038"/><circle cx="62" cy="28" r="6" fill="#8b6038"/><circle cx="70" cy="21" r="5" fill="#8b6038"/><path d="M39 53Q55 60 71 53" fill="none" stroke="#fff7e9" stroke-width="5" stroke-linecap="round"/></svg><span class="zone-label">Hrana 🍖</span></button>
<button class="zone" id="ball" aria-label="Loptica za učenje boja" title="Igra i boje"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="49" r="42" fill="#e97f7e" stroke="#353037" stroke-width="6"/><path d="M22 14Q69 46 67 88" fill="none" stroke="#fff4dc" stroke-width="13"/><ellipse cx="36" cy="25" rx="12" ry="5" fill="#ffffff9d" transform="rotate(-34 36 25)"/></svg><span class="zone-label">Loptica 🎾</span></button>
<button class="zone" id="walking" aria-label="Šetnja preko trave" title="Šetnja"><svg viewBox="0 0 140 112" aria-hidden="true"><path d="M6 99Q14 44 34 82Q49 34 60 73Q81 22 92 72Q115 42 136 100Z" fill="#79bf76" stroke="#353037" stroke-width="4" stroke-linejoin="round"/><path d="M20 102L31 73M50 101L55 68M83 99L95 60M114 101L121 80" stroke="#3c7f49" stroke-width="3"/><g fill="#fff8e8" stroke="#353037" stroke-width="3"><path d="M24 58Q14 48 19 35Q29 26 35 41L38 51Q35 63 24 58Z"/><path d="M62 44Q52 36 58 23Q69 17 74 32L76 39Q73 50 62 44Z"/><path d="M100 65Q88 54 95 43Q108 38 111 54L111 62Q109 69 100 65Z"/></g></svg><span class="zone-label">Šetnja 👣</span></button>
<button class="zone" id="training" aria-label="Labirint i učenje kretanja" title="Pronađi lopticu u labirintu"><svg viewBox="0 0 160 110" aria-hidden="true"><path d="M11 94H149" stroke="#353037" stroke-width="5" stroke-linecap="round"/><path d="M33 85L44 27L58 85Z" fill="#ecae69" stroke="#353037" stroke-width="5" stroke-linejoin="round"/><path d="M35 63H56" stroke="#fff9e4" stroke-width="7"/><path d="M96 85L110 24L126 85Z" fill="#ecae69" stroke="#353037" stroke-width="5" stroke-linejoin="round"/><path d="M100 62H121" stroke="#fff9e4" stroke-width="7"/><path d="M69 57L82 43L95 57M82 43V18" stroke="#353037" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="zone-label">Labirint 🧩</span></button>
<div id="dog" data-mood="happy" tabindex="0" role="button" aria-label="Pomazi Malog"><svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g id="tail"><path d="M172 150Q215 148 214 109" fill="none" stroke="#353037" stroke-width="20" stroke-linecap="round"/><path d="M172 150Q215 148 214 109" fill="none" stroke="#ca9367" stroke-width="12" stroke-linecap="round"/></g><ellipse cx="119" cy="153" rx="66" ry="54" fill="#fff8e7" stroke="#353037" stroke-width="5"/><ellipse cx="80" cy="197" rx="23" ry="14" fill="#fff8e7" stroke="#353037" stroke-width="4"/><ellipse cx="157" cy="197" rx="23" ry="14" fill="#fff8e7" stroke="#353037" stroke-width="4"/><path d="M65 73Q35 39 20 66Q8 98 47 119L75 92Z" fill="#d6a173" stroke="#353037" stroke-width="5"/><path d="M174 72Q208 40 221 68Q232 98 193 119L164 90Z" fill="#d6a173" stroke="#353037" stroke-width="5"/><ellipse cx="120" cy="86" rx="72" ry="70" fill="#fff8e7" stroke="#353037" stroke-width="5"/><path d="M53 62Q64 23 103 17L98 65Z" fill="#d6a173"/><path d="M137 18Q176 24 187 62L149 64Z" fill="#d6a173"/><g class="eye-open"><ellipse cx="94" cy="86" rx="8" ry="11" fill="#353037"/><ellipse cx="147" cy="86" rx="8" ry="11" fill="#353037"/><circle cx="97" cy="82" r="3" fill="white"/><circle cx="150" cy="82" r="3" fill="white"/></g><g class="eye-sleep" fill="none" stroke="#353037" stroke-width="4" stroke-linecap="round"><path d="M82 87Q94 101 106 87M135 87Q147 101 159 87"/></g><ellipse cx="75" cy="111" rx="10" ry="5" fill="#eaa7a5" opacity=".7"/><ellipse cx="167" cy="111" rx="10" ry="5" fill="#eaa7a5" opacity=".7"/><ellipse cx="120" cy="111" rx="8" ry="6" fill="#353037"/><path class="mouth" d="M110 122Q120 140 130 122" fill="none" stroke="#353037" stroke-width="4" stroke-linecap="round"/></svg></div>
<div class="bubble" id="bubble">Vau! Dobrodošao! 🐾</div><div class="info" id="info" aria-live="polite">Klikni na predmet da se igramo.</div>
<div class="overlay" id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="close" aria-label="Zatvori">✕</button><h2 id="modalTitle"></h2><div id="modalContent"></div></div></div>
</main>
<script src="./firebase-config.js"></script>
<script src="./game-config.js"></script>
<script src="./firebase-sync.js"></script>
<script src="./colors.js"></script>
<script src="./navigation-brain.js"></script>
<script src="./maze.js"></script>
<script>
(()=>{
 const $=x=>document.getElementById(x), clamp=n=>Math.max(0,Math.min(100,n));
 const key='mali-room-test-v1';
 let saved=null;try{saved=JSON.parse(localStorage.getItem(key))}catch{}
 const now=Date.now();
 let s=saved&&Number.isFinite(saved.born)?saved:{born:now,last:now,food:75,energy:82,joy:76,xp:0,walks:0,lessons:0,sleep:false,fitness:50};
 let steps=0,closeTimer=null,modalType='';
 function persist(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}
 function tick(){const t=Date.now();const h=Math.min(72,Math.max(0,(t-(s.last||t))/3600000));s.food=clamp(s.food-h*1.4);s.joy=clamp(s.joy-h*.8);s.energy=clamp(s.energy+h*(s.sleep?12:-1.1));s.last=t;persist();render()}
 function calendarDay(born,now){const first=new Date(born),current=new Date(now);if(!Number.isFinite(first.getTime()))return 1;const a=Date.UTC(first.getFullYear(),first.getMonth(),first.getDate()),b=Date.UTC(current.getFullYear(),current.getMonth(),current.getDate());return Math.max(1,1+Math.round((b-a)/86400000))}
 function render(){for(const k of ['food','energy','joy']){$(k+'N').textContent=Math.round(s[k]);$(k+'B').style.width=clamp(s[k])+'%'}$('day').textContent='DAN '+calendarDay(s.born,Date.now());$('dog').dataset.mood=s.sleep?'sleep':s.food<22||s.energy<17?'sad':'happy'}
 function speak(t,info){$('bubble').textContent=t;$('info').textContent=info;clearTimeout(closeTimer);closeTimer=setTimeout(()=>{$('bubble').textContent=s.sleep?'Zzz…':'Vau! 🐾'},2300)}
 function go(x,y,emotion='excited'){$('dog').style.left=x+'%';$('dog').style.top=y+'%';$('bubble').style.left=x+'%';$('bubble').style.top='calc('+y+'% - 118px)';$('dog').dataset.mood=emotion;setTimeout(render,1100)}
 function open(type,title,html){modalType=type;$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('overlay').hidden=false}
 function close(){$('overlay').hidden=true;modalType=''}$('close').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});
 $('house').onclick=()=>{tick();go(76,53,s.sleep?'excited':'sleep');s.sleep=!s.sleep;s.energy=clamp(s.energy+(s.sleep?0:3));persist();render();speak(s.sleep?'Laku noć! 💤':'Dobro jutro! ☀️',s.sleep?'Mali spava i puni energiju.':'Mali se probudio.')};
 $('bowl').onclick=()=>{tick();if(s.sleep){speak('Zzz…','Probudi ga klikom na kućicu.');return}go(window.innerWidth<=640?29:49,window.innerWidth<=640?72:73);s.food=clamp(s.food+18);s.joy=clamp(s.joy+3);s.xp++;persist();render();speak('Njam! 🍖','Sitost je porasla. +1 iskustvo.')};
 $('dog').onclick=()=>{tick();if(s.sleep){speak('Zzz…','Mali sada spava.');return}s.joy=clamp(s.joy+5);persist();$('dog').dataset.mood='excited';speak('Volim maženje! ❤️','Sreća +5.');render()};$('dog').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('dog').click()}};
 $('ball').onclick=()=>{tick();if(s.sleep){speak('Zzz…','Prvo probudi Malog.');return}go(72,67);window.MaliColors.open({open,s,persist,render,speak});};
 $('walking').onclick=()=>{tick();if(s.sleep){speak('Zzz…','Prvo probudi Malog.');return}go(73,80);steps=0;open('walk','Idemo u šetnju! 👣',`<p>Mali je donio povodac. Napravi 12 koraka!</p><div class="progress"><div id="walkProgress"></div></div><p id="stepCount"><strong>0 / 12</strong> koraka</p><button class="action" id="takeStep">👣 Napravi korak</button>`)};
 $('training').onclick=()=>{tick();if(s.sleep){speak('Zzz…','Prvo probudi Malog.');return}go(34,77);window.MaliMaze.open({open,s,persist,render,speak});};
 $('modalContent').addEventListener('click',e=>{
 if(modalType.indexOf('colors-')===0)window.MaliColors.handleClick(e);
 if(modalType==='maze')window.MaliMaze.handleClick(e);
 if(e.target.id==='takeStep'&&modalType==='walk'){steps++;$('walkProgress').style.width=steps/12*100+'%';$('stepCount').innerHTML='<strong>'+steps+' / 12</strong> koraka';if(steps===12){s.walks++;s.fitness=clamp(s.fitness+2);s.energy=clamp(s.energy-9);s.food=clamp(s.food-4);s.joy=clamp(s.joy+10);s.xp+=10;persist();render();e.target.textContent='✅ Šetnja završena!';e.target.disabled=true;speak('Vau, hvala! ♥','+10 iskustva, kondicija +2.')}}

 });
 tick();setInterval(tick,60000);
})();
</script>
</body></html>
